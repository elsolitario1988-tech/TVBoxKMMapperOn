# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the
# command line, check build.gradle files instead.

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and does nothing about the resources declared in
# dependency libraries -  the linking is done at the library merge, package, and R class
# generation time. Name namespacing is disabled for the main app so as to not impose
# compatibility constraints on existing code that GRabs the app's R class.

android.useNamespace=true
android.nonTransitiveRClass=false

# Gradle memory settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m

# Enable parallel builds
org.gradle.parallel=true

# Enable build cache
org.gradle.caching=true

# Kotlin
kotlin.code.style=official
